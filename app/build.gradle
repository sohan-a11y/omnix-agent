plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.devtools.ksp" version "2.2.21-2.0.5"
    id "org.jetbrains.kotlin.plugin.serialization" version "2.2.21"
    id "org.jlleitschuh.gradle.ktlint"
    id "io.gitlab.arturbosch.detekt"
}

android {
    compileSdk 36
    namespace "com.omnix.agent"

    defaultConfig {
        applicationId "com.omnix.agent"
        minSdk 31
        targetSdk 36
        versionCode (System.getenv("VERSION_CODE")?.toInteger() ?: 1)
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // No external API keys needed — wake word uses Sherpa-ONNX, ASR uses Whisper (both free)
    }

    signingConfigs {
        release {
            storeFile System.getenv("KEYSTORE_PATH") ? file(System.getenv("KEYSTORE_PATH")) : null
            storePassword System.getenv("STORE_PASSWORD") ?: ""
            keyAlias System.getenv("KEY_ALIAS") ?: ""
            keyPassword System.getenv("KEY_PASSWORD") ?: ""
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig signingConfigs.release
        }
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
    }

    splits {
        abi {
            enable true
            reset()
            include "arm64-v8a", "armeabi-v7a", "x86_64"
            universalApk false
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
        freeCompilerArgs += ["-opt-in=kotlinx.coroutines.ExperimentalCoroutinesApi"]
    }

    sourceSets {
        main {
            kotlin.srcDirs = ['src/main/kotlin']
        }
        test {
            kotlin.srcDirs = ['src/test/kotlin']
        }
        androidTest {
            kotlin.srcDirs = ['src/androidTest/kotlin']
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
            returnDefaultValues = true
        }
    }
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
    arg("room.incremental", "true")
    arg("room.generateKotlin", "true")
}

dependencies {
    // LiteRT-LM — runs .litertlm models (Gemma 4 E2B) with GPU acceleration
    implementation "com.google.ai.edge.litertlm:litertlm-android:0.10.0"

    // Room Database
    implementation "androidx.room:room-runtime:2.7.1"
    implementation "androidx.room:room-ktx:2.7.1"
    ksp "androidx.room:room-compiler:2.7.1"

    // Kotlin Serialization
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:1.6.3"

    // Coroutines
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0"

    // Vosk — free on-device ASR + wake word, no API key (Apache 2.0)
    // Grammar mode for "hey omnix" detection; free-form mode for command transcription
    implementation "com.alphacephei:vosk-android:0.3.47"

    // Lifecycle
    implementation "androidx.lifecycle:lifecycle-service:2.8.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.0"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.0"

    // AndroidX Core
    implementation "androidx.core:core-ktx:1.13.1"
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.1.4"

    // WorkManager
    implementation "androidx.work:work-runtime-ktx:2.9.0"

    // Google Play Services Location (FusedLocationProvider for EventTriggerEngine)
    implementation "com.google.android.gms:play-services-location:21.3.0"

    // Encrypted SharedPreferences for API key storage + DB passphrase
    implementation "androidx.security:security-crypto:1.1.0-alpha06"

    // SQLCipher — AES-256 encryption for Room database (C2 audit fix)
    implementation "net.zetetic:sqlcipher-android:4.6.1"
    implementation "androidx.sqlite:sqlite-ktx:2.4.0"

    // Markwon — lightweight Markdown-to-Spanned rendering in TextView (no WebView)
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation "io.noties.markwon:linkify:4.6.2"

    // Testing
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.13.1"
    testImplementation "androidx.test.ext:junit:1.1.5"
    testImplementation "androidx.test:core:1.5.0"
    testImplementation "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.7.3"
    testImplementation "io.mockk:mockk:1.13.9"
    androidTestImplementation "androidx.test.ext:junit:1.2.1"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.6.1"

    // Detekt formatting rules (ktlint-backed)
    detektPlugins "io.gitlab.arturbosch.detekt:detekt-formatting:1.23.8"
}

// ── KtLint ──────────────────────────────────────────────────────────────────
ktlint {
    version = "1.3.1"
    android = true
    reporters {
        reporter "checkstyle"
        reporter "html"
    }
    filter {
        exclude("**/generated/**")
        include("**/*.kt")
    }
}

// ── Detekt ───────────────────────────────────────────────────────────────────
detekt {
    config.setFrom(files("$rootDir/config/detekt/detekt.yml"))
    buildUponDefaultConfig = true
    autoCorrect = false
    source.setFrom(files("src/main/kotlin", "src/test/kotlin"))
}
