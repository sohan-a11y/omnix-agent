name: Build & Release OMNIX APK

on:
  push:
    branches: [ master, main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

      # ── Signed Release APK (every push to master/main + tags) ─────────────
      - name: Build Signed Release APK
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK as Artifact
        if: "!startsWith(github.ref, 'refs/tags/v')"
        uses: actions/upload-artifact@v4
        with:
          name: OMNIX-signed-${{ github.sha }}
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

      # ── GitHub Release (on v* tags only) ──────────────────────────────────
      - name: Upload to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: OMNIX ${{ github.ref_name }}
          files: app/build/outputs/apk/release/*.apk
          body: |
            ## OMNIX ${{ github.ref_name }}

            Signed release APK for Android 12+ (arm64-v8a / Samsung Galaxy S25 Ultra).

            ### Install
            1. Enable **Install unknown apps** in Settings → Security
            2. Download the APK below
            3. Open it and tap Install
            4. Grant **Accessibility Service** permission to OMNIX
            5. Download the Vosk speech model when prompted (~40 MB, Wi-Fi recommended)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
